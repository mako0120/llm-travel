<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>設定 | TRAVIA</title>
<link rel="stylesheet" href="travia.css">
</head>
<body>
<div class="app-shell">
  <aside class="side">
    <a class="logo"><i>T</i>TRAVIA</a>
    <button class="new-trip">＋ 新しい旅行をつくる</button>
    <nav>
      <a href="home.html">⌂ ホーム</a>
      <a href="planner.html">✦ AI旅行プランナー</a>
      <a href="itinerary.html">▤ 旅程を見る</a>
      <a href="#">⌕ 情報収集</a>
      <a href="double-check.html">◈ AIダブルチェック</a>
      <a href="history.html">▥ 改善履歴</a>
      <a href="public-list.html">♧ 公開プラン一覧</a>
    </nav>
    <div class="footer-nav"><a class="active" href="settings.html">⚙ 設定</a><a href="#">? ヘルプ</a></div>
  </aside>
  <div class="main">
    <div class="topbar"><div class="search">⌕ 検索</div><div class="spacer"></div><div class="avatar">U</div></div>
    <div class="content">
      <div class="page-head"><h1>設定</h1></div>

      <div class="settings-shell">
        <nav class="settings-nav">
          <a>プロフィール</a>
          <a>通知</a>
          <a>表示</a>
          <a class="active">旅行の好み</a>
          <a>プライバシー</a>
        </nav>

        <div>
          <div class="card" style="padding:26px 28px">
            <div class="form-row">
              <label>食事の好み</label>
              <div class="pill-select">
                <span class="pill selected">和食</span><span class="pill">寿司</span><span class="pill">ラーメン</span>
                <span class="pill selected">カフェ</span><span class="pill selected">喫茶店</span><span class="pill">スイーツ</span><span class="pill">洋食</span><span class="pill">居酒屋</span>
              </div>
            </div>
            <div class="form-row">
              <label>旅行テーマ</label>
              <div class="pill-select">
                <span class="pill selected">王道</span><span class="pill">穴場</span><span class="pill selected">写真映え</span>
                <span class="pill">温泉</span><span class="pill">自然</span><span class="pill selected">歴史</span><span class="pill">ショッピング</span><span class="pill">アート</span>
              </div>
            </div>
            <div class="form-row">
              <label>旅のペース</label>
              <div class="pill-select"><span class="pill selected">ゆったり</span><span class="pill">普通</span><span class="pill">多く巡る</span></div>
            </div>
            <div class="form-row">
              <label>移動</label>
              <div class="pill-select"><span class="pill selected">徒歩OK</span><span class="pill selected">公共交通</span><span class="pill">タクシーOK</span><span class="pill">車</span></div>
            </div>
            <div class="form-row">
              <label>苦手なこと</label>
              <div class="pill-select"><span class="pill selected">長時間徒歩</span><span class="pill">混雑</span><span class="pill">早朝</span><span class="pill selected">行列</span></div>
            </div>
            <div class="form-row" style="margin-bottom:0">
              <label>予算の目安</label>
              <div class="pill-select"><span class="pill">〜3万円</span><span class="pill">3〜5万円</span><span class="pill selected">5〜7万円</span><span class="pill">7〜10万円</span><span class="pill">10万円〜</span></div>
            </div>
          </div>
          <div style="margin-top:18px"><button class="btn btn-primary">保存する</button></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
