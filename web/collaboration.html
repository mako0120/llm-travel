<!doctype html><meta charset="utf-8"><title>AIチーム対話</title><style>body{font-family:sans-serif;max-width:760px;margin:40px auto;color:#102b48}#log{border:1px solid #ddd;padding:16px;min-height:300px}.m{padding:12px;margin:8px 0;background:#eef4f9;border-radius:8px}.human{background:#fff0ce}textarea{width:100%;height:90px;margin-top:16px}button{padding:12px 20px;background:#f7b93e;border:0;border-radius:7px;font-weight:bold}</style><h1>Claude × Codex × あなた</h1><p>AIチームの意見を確認し、あなた自身の意見を送れます。</p><div id="log"></div><textarea id="text" placeholder="あなたの意見・要望・判断を書いてください"></textarea><button onclick="post()">意見を送る</button><script>let c=0;async function poll(){let d=await fetch('/api/dialogue?conversation_id=ai-001&after='+c).then(r=>r.json());for(let m of d.messages){c=m.sequence;let e=document.createElement('div');e.className='m '+m.author;e.textContent=m.author+'：'+(m.body.position||m.body.text||JSON.stringify(m.body));document.querySelector('#log').append(e)}}async function post(){let t=text.value.trim();if(!t)return;await fetch('/api/dialogue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversation_id:'ai-001',body:{text:t}})});text.value='';poll()}poll();setInterval(poll,3000)</script>
