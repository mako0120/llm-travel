<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>旅の計画</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <b>旅の計画</b>
  <span>AIとつくる、あなただけの旅</span>
  <nav>旅をさがす　プランを作る　マイプラン</nav>
</header>
<main>
  <aside>
    <h3>AIコンシェルジュ <i id="status">● オンライン</i></h3>
    <div id="chat"></div>
    <div class="prompt">
      <input id="answer" placeholder="メッセージを入力…" autocomplete="off">
      <button id="send" aria-label="送信">送信</button>
    </div>
  </aside>
  <section>
    <div class="steps" id="steps">
      <span class="step" data-n="1">① 旅行の希望</span>
      <span class="step" data-n="2">② プランを作成</span>
      <span class="step" data-n="3">③ 内容を確認</span>
      <span class="step" data-n="4">④ 保存</span>
    </div>
    <h1 id="title">AI旅行計画を作成しますか？</h1>
    <p id="sub">「はい」と答えると、あなたに合う旅行プランを一緒に作ります。</p>
    <div id="form"></div>
    <button class="primary" id="next">はい、作成してください　→</button>
  </section>
  <article>
    <h2>旅行プランのプレビュー</h2>
    <p class="muted">条件を確認後、根拠付きのプランを作成します。</p>
    <div class="tabs">日程　地図　見どころ　宿泊　費用</div>
    <div id="preview">
      <strong>情報を集める準備ができています</strong>
      <p>出典・取得時刻・鮮度を確認し、未確認情報は表示で区別します。</p>
    </div>
    <footer id="totals">合計費用：未確認　　移動費：未確認　　宿泊費：未確認</footer>
  </article>
</main>
<script src="app.js"></script>
</body>
</html>
